<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body style="margin:0; min-height:100vh; background:linear-gradient(135deg,#667eea,#764ba2); display:flex; align-items:center; justify-content:center; font-family:Arial,sans-serif;">

    <!-- Login Card -->
    <div class="card shadow-lg border-0"
         style="width:100%; max-width:420px; border-radius:20px; overflow:hidden;">

        <div class="card-body p-4 p-md-5">

            <!-- Logo / Title -->
            <div class="text-center mb-4">

                <div style="width:70px; height:70px; background:#667eea; color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:auto; font-size:30px;">
                    <i class="bi bi-person-fill"></i>
                </div>

                <h2 class="mt-3 mb-1 fw-bold">Welcome Back</h2>

                <p class="text-muted">
                    Login to your account
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Email Address
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Enter your email"
                               required>
                    </div>

                </div>

                <!-- Password -->
                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input type="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter your password"
                               required>

                        <button type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword()">

                            <i class="bi bi-eye" id="eyeIcon"></i>

                        </button>

                    </div>

                </div>

                <!-- Remember + Forgot -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">

                        <input class="form-check-input"
                               type="checkbox"
                               id="remember">

                        <label class="form-check-label" for="remember">
                            Remember me
                        </label>

                    </div>

                    <a href="#"
                       style="text-decoration:none; color:#667eea;">
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit"
                        class="btn w-100 text-white fw-bold"
                        style="background:#667eea; border-radius:10px; padding:12px;">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Login

                </button>

                <!-- Message -->
                <div id="message"
                     class="text-center mt-3 fw-semibold">
                </div>

            </form>

            <!-- Register -->
            <div class="text-center mt-4">

                <span class="text-muted">
                    Don't have an account?
                </span>

                <a href="#"
                   style="text-decoration:none; color:#667eea; font-weight:bold;">
                    Create Account
                </a>

            </div>

        </div>
    </div>


    <!-- JavaScript -->
    <script>

        // Show / Hide Password
        function togglePassword() {

            let password = document.getElementById("password");
            let eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");

            } else {

                password.type = "password";

                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");

            }
        }


        // Login Form
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (email === "" || password === "") {

                message.innerHTML = "Please fill all fields.";
                message.style.color = "red";

            } else {

                message.innerHTML = "Login Successful!";
                message.style.color = "green";

            }

        });

    </script>

</body>
</html>
