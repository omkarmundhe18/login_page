<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .login-title {
            text-align: center;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777777;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 600;
            color: #444444;
        }

        .form-control {
            padding: 12px;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.15);
        }

        .password-box {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #764ba2;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .password-box input {
            padding-right: 65px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.3s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            color: #777777;
            font-size: 14px;
        }

        .footer-text span {
            color: #764ba2;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h2 class="login-title">Welcome Back!</h2>

        <p class="subtitle">Please login to your account</p>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <div class="password-box">
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword">
                        Show
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe">

                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>

                <a href="#" id="forgotPassword"
                   class="text-decoration-none"
                   style="color: #764ba2; font-size: 13px;">
                    Forgot Password?
                </a>
            </div>

            <div id="message"
                 class="small mb-3"
                 role="status"
                 aria-live="polite"></div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="footer-text">
            Secure Demo Login
        </p>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const message = document.getElementById("message");

        // Show / Hide Password
        togglePassword.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.textContent = "Hide";
            } else {
                passwordInput.type = "password";
                togglePassword.textContent = "Show";
            }
        });

        // Demo Login
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            message.textContent = "";
            message.className = "small mb-3";

            if (!email || !password) {
                message.textContent = "Please fill in all fields.";
                message.classList.add("text-danger");
                return;
            }

            // Demo only: no real authentication is performed.
            const userName = email.split("@")[0];

            const storage = document.getElementById("rememberMe").checked
                ? localStorage
                : sessionStorage;

            // Clear previous demo session from both storage areas.
            localStorage.removeItem("loggedIn");
            localStorage.removeItem("userName");
            localStorage.removeItem("userEmail");

            sessionStorage.removeItem("loggedIn");
            sessionStorage.removeItem("userName");
            sessionStorage.removeItem("userEmail");

            storage.setItem("loggedIn", "true");
            storage.setItem("userName", userName);
            storage.setItem("userEmail", email);

            window.location.href = "dashboard.html";
        });

        // Demo Forgot Password message
        document.getElementById("forgotPassword").addEventListener("click", function (event) {
            event.preventDefault();
            alert("Password reset is not configured yet.");
        });
    </script>

</body>
</html>
