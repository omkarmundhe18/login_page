<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f5fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .dashboard {
            padding: 40px 15px;
        }

        .welcome-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .feature-card {
            background: white;
            border: none;
            border-radius: 16px;
            padding: 25px;
            height: 100%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: transform 0.2s;
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-icon {
            font-size: 32px;
        }

        .logout-btn {
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                My Dashboard
            </a>

            <button class="btn btn-light logout-btn"
                    onclick="logout()">
                Logout
            </button>
        </div>
    </nav>

    <main class="container dashboard">

        <section class="welcome-card">
            <h2 id="welcomeMessage">Welcome Back!</h2>
            <p class="mb-0">
                You have successfully opened your dashboard.
            </p>
        </section>

        <h4 class="mb-4">Dashboard Overview</h4>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="feature-card">
                    <div class="feature-icon">👤</div>
                    <h5 class="mt-3">My Profile</h5>
                    <p id="userName">User</p>
                    <p id="userEmail" class="text-muted">
                        No email available
                    </p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="feature-card">
                    <div class="feature-icon">⚙️</div>
                    <h5 class="mt-3">Settings</h5>
                    <p class="text-muted">
                        Manage your account preferences.
                    </p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="feature-card">
                    <div class="feature-icon">🔐</div>
                    <h5 class="mt-3">Account</h5>
                    <p class="text-muted">
                        Your account dashboard is ready.
                    </p>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Check whether a demo login session exists
        const loggedIn =
            sessionStorage.getItem("loggedIn");

        if (loggedIn !== "true") {
            window.location.replace("index.html");
        }

        const name =
            sessionStorage.getItem("userName") || "User";

        const email =
            sessionStorage.getItem("userEmail") || "Not provided";

        document.getElementById("welcomeMessage").textContent =
            "Welcome Back, " + name + "!";

        document.getElementById("userName").textContent = name;
        document.getElementById("userEmail").textContent = email;

        function logout() {
            sessionStorage.removeItem("loggedIn");
            sessionStorage.removeItem("userName");
            sessionStorage.removeItem("userEmail");

            window.location.replace("index.html");
        }
    </script>

</body>
</html>
